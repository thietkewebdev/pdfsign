[workspace]
resolver = "2"
members = ["crates/pdfsign-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
pdfsign-core = { path = "../pdfsign-signer-rust/crates/pdfsign-core", features = ["tsa"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
