[package]
name = "pdfsign-core"
description = "PAdES (ETSI.CAdES.detached) incremental-update PDF signing with visible appearance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["tsa"]
# RFC 3161 timestamping over HTTP (PAdES B-T).
tsa = ["dep:ureq", "dep:x509-tsp", "dep:cmpv2"]

[dependencies]
thiserror.workspace = true
chrono.workspace = true
hex.workspace = true
lopdf.workspace = true
flate2.workspace = true
ttf-parser.workspace = true
subsetter.workspace = true
unicode-normalization.workspace = true
image.workspace = true
der.workspace = true
cms.workspace = true
x509-cert.workspace = true
spki.workspace = true
const-oid.workspace = true
sha2.workspace = true
rand.workspace = true
rsa.workspace = true
x509-tsp = { workspace = true, optional = true }
cmpv2 = { version = "0.2", optional = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
image = { workspace = true }
