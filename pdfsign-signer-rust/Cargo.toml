[workspace]
resolver = "2"
members = ["crates/pdfsign-core", "crates/pdfsign-token", "crates/pdfsign-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.80"

[workspace.dependencies]
pdfsign-core = { path = "crates/pdfsign-core" }
pdfsign-token = { path = "crates/pdfsign-token" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"

lopdf = { version = "0.47", default-features = false }
flate2 = "1"
ttf-parser = "0.25"
subsetter = "0.2"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

der = { version = "0.7", features = ["alloc", "derive", "oid"] }
cms = "0.2"
x509-cert = "0.2"
x509-tsp = "0.1"
spki = "0.7"
const-oid = { version = "0.9", features = ["db"] }
sha2 = { version = "0.10", features = ["oid"] }
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
ureq = "3"

cryptoki = "0.12"
libloading = "0.9"

clap = { version = "4", features = ["derive"] }
rpassword = "7"

[profile.release]
lto = "thin"
strip = true
