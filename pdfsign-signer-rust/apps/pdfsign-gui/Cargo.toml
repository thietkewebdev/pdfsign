[package]
name = "pdfsign-gui"
description = "PDFSign desktop signer (Tauri v2)"
version = "0.3.0"
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.90"

# Separate workspace: Tauri needs system webview libs on Linux and a newer compiler,
# so it must not be pulled into `cargo build --workspace` of the core crates.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pdfsign-core = { path = "../../crates/pdfsign-core" }
pdfsign-token = { path = "../../crates/pdfsign-token" }
pdfsign-app = { path = "../../crates/pdfsign-app" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = "thin"
strip = true
