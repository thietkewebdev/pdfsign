<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDFSign - Ký số</title>
    <!-- Self-contained on purpose: style.css lays out body as the full app's sidebar grid. -->
    <style>
      @font-face { font-family: Inter; font-weight: 400; font-display: swap; src: url("fonts/Inter-Regular.woff2") format("woff2"); }
      @font-face { font-family: Inter; font-weight: 500; font-display: swap; src: url("fonts/Inter-Medium.woff2") format("woff2"); }
      @font-face { font-family: Inter; font-weight: 600; font-display: swap; src: url("fonts/Inter-SemiBold.woff2") format("woff2"); }
      :root {
        --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --line-strong: #cbd5e1;
        --surface: #ffffff; --surface-2: #f8fafc;
        --accent: #e11d48; --accent-hover: #be123c; --accent-ring: rgba(225, 29, 72, 0.18);
        --ok: #047857; --ok-soft: #ecfdf5; --ok-border: #a7f3d0;
        --bad: #7f1d1d; --bad-soft: #fef2f2; --bad-border: #fecaca;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--surface); color: var(--ink);
        font: 14px/1.45 Inter, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased; overflow: hidden; user-select: none;
      }
      .q { display: flex; flex-direction: column; gap: 14px; height: 100%; padding: 20px 22px 14px; }
      .q-head { display: flex; align-items: center; gap: 12px; }
      .q-logo {
        flex: none; width: 36px; height: 36px; border-radius: 10px;
        background: var(--accent); color: #fff; display: grid; place-items: center;
        font-size: 18px; font-weight: 600;
      }
      .q-head h1 { margin: 0; font-size: 16px; font-weight: 600; }
      .q-head p { margin: 1px 0 0; color: var(--muted); font-size: 13px; }
      .q-form { display: flex; flex-direction: column; gap: 14px; }
      .q-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface-2); }
      .q-card .lbl { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
      .q-card b { display: block; font-weight: 600; font-size: 13px; line-height: 1.4; }
      .q-card .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
      .q label { display: flex; flex-direction: column; gap: 6px; font-weight: 500; font-size: 13px; }
      .q select, .q input {
        width: 100%; font: inherit; color: var(--ink); padding: 10px 12px;
        border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; user-select: text;
      }
      .q input:focus, .q select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
      .q input[type="password"]:not(:placeholder-shown) { font-size: 16px; letter-spacing: 2px; }
      button { font: inherit; cursor: pointer; }
      .q-sign {
        width: 100%; padding: 11px; border: 0; border-radius: 8px;
        background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
      }
      .q-sign:hover:not(:disabled) { background: var(--accent-hover); }
      .q-sign:disabled { opacity: 0.45; cursor: default; }
      .q-msg { font-size: 13px; line-height: 1.45; padding: 9px 12px; border-radius: 8px; }
      .q-msg.err { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad-border); }
      .q-msg.info { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
      .q-notoken { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .q-notoken button {
        flex: none; padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; color: var(--ink);
      }
      .q-done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; }
      .q-done .tick {
        width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 26px;
        background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok-border);
      }
      .q-done h2 { margin: 6px 0 0; font-size: 17px; font-weight: 600; }
      .q-done p { margin: 0; color: var(--muted); }
      .q-foot { margin-top: auto; display: flex; justify-content: space-between; font-size: 12px; }
      .q-foot button { background: none; border: 0; padding: 0; color: var(--muted); }
      .q-foot button:hover { color: var(--ink); text-decoration: underline; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="q">
      <div class="q-head">
        <div class="q-logo" aria-hidden="true">✓</div>
        <div>
          <h1>Ký số từ trình duyệt</h1>
          <p id="q-sub">Đang chờ lệnh ký…</p>
        </div>
      </div>

      <section id="q-form" class="q-form">
        <div id="q-cert-one" class="q-card" hidden>
          <div class="lbl">Chứng thư ký</div>
          <b id="q-cert-name"></b>
          <div id="q-cert-meta" class="meta"></div>
        </div>
        <label id="q-cert-many" hidden>Chứng thư ký
          <select id="q-cert"></select>
        </label>
        <div id="q-notoken" class="q-msg info q-notoken" hidden>
          <span>Chưa thấy token có chứng thư còn hạn. Cắm token rồi dò lại.</span>
          <button id="q-rescan" type="button">Dò lại</button>
        </div>
        <label id="q-pin-wrap">Mã PIN token
          <input id="q-pin" type="password" autocomplete="off" placeholder="Nhập mã PIN" />
        </label>
        <div id="q-msg" class="q-msg" hidden></div>
        <button id="q-sign" class="q-sign" type="button" disabled>Ký</button>
      </section>

      <section id="q-done" class="q-done" hidden>
        <div class="tick" aria-hidden="true">✓</div>
        <h2>Đã ký xong</h2>
        <p>Quay lại trình duyệt để tải file.</p>
      </section>

      <div class="q-foot">
        <button id="q-full" type="button">Mở PDFSign đầy đủ</button>
        <button id="q-log" type="button">Xem log</button>
      </div>
    </div>
    <script type="module" src="js/quick.js"></script>
  </body>
</html>
