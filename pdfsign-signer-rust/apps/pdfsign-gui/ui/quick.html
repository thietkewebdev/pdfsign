<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDFSign - Ký số</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      html, body { height: 100%; }
      body { margin: 0; background: var(--surface); color: var(--ink); font-family: Inter, system-ui, sans-serif; font-size: 14px; }
      .q { display: flex; flex-direction: column; height: 100%; padding: 20px 22px 14px; box-sizing: border-box; gap: 16px; }
      .q-head { display: flex; align-items: center; gap: 10px; }
      .q-logo { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; }
      .q-head h1 { margin: 0; font-size: 16px; font-weight: 600; }
      .q-head p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
      .q-card { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 14px; background: var(--surface-2); }
      .q-card b { display: block; font-weight: 600; line-height: 1.35; }
      .q-card span { color: var(--muted); font-size: 12px; }
      .q label { display: flex; flex-direction: column; gap: 6px; font-weight: 500; font-size: 13px; }
      .q select, .q input { font: inherit; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: #fff; }
      .q input:focus, .q select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
      .q-sign { width: 100%; padding: 12px; font-size: 15px; }
      .q-msg { font-size: 13px; line-height: 1.45; padding: 10px 12px; border-radius: var(--radius); }
      .q-msg.err { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad-border); }
      .q-msg.info { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
      .q-done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
      .q-done .tick { width: 56px; height: 56px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; font-size: 28px; border: 1px solid var(--ok-border); }
      .q-done h2 { margin: 0; font-size: 17px; }
      .q-done p { margin: 0; color: var(--muted); }
      .q-foot { margin-top: auto; display: flex; justify-content: space-between; font-size: 12px; }
      .q-foot button { background: none; border: 0; padding: 0; color: var(--muted); font-weight: 500; }
      .q-foot button:hover { color: var(--ink); text-decoration: underline; }
      .q-row { display: flex; gap: 8px; }
      .q-row button { white-space: nowrap; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="q">
      <div class="q-head">
        <div class="q-logo" aria-hidden="true">✓</div>
        <div>
          <h1>Ký số từ trình duyệt</h1>
          <p id="q-sub">Đang chờ lệnh ký…</p>
        </div>
      </div>

      <section id="q-form">
        <div style="display: flex; flex-direction: column; gap: 14px">
          <div id="q-cert-one" class="q-card" hidden>
            <b id="q-cert-name"></b>
            <span id="q-cert-meta"></span>
          </div>
          <label id="q-cert-many" hidden>Chứng thư
            <select id="q-cert"></select>
          </label>
          <div id="q-notoken" class="q-msg info" hidden>
            <div class="q-row" style="align-items: center; justify-content: space-between">
              <span>Chưa thấy token có chứng thư còn hạn. Cắm token rồi dò lại.</span>
              <button id="q-rescan" type="button">Dò lại</button>
            </div>
          </div>
          <label id="q-pin-wrap">Mã PIN token
            <input id="q-pin" type="password" autocomplete="off" placeholder="••••••" />
          </label>
          <div id="q-msg" class="q-msg" hidden></div>
          <button id="q-sign" class="primary q-sign" type="button" disabled>Ký</button>
        </div>
      </section>

      <section id="q-done" class="q-done" hidden>
        <div class="tick" aria-hidden="true">✓</div>
        <h2>Đã ký xong</h2>
        <p>Quay lại trình duyệt để tải file.</p>
      </section>

      <div class="q-foot">
        <button id="q-full" type="button">Mở PDFSign đầy đủ</button>
        <button id="q-log" type="button">Xem log</button>
      </div>
    </div>
    <script type="module" src="js/quick.js"></script>
  </body>
</html>
